name: Checks
# Automatic triggers are paused at the user's request. Restore after testing resumes.
on: workflow_dispatch
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - run: npm ci
      - run: supabase start -x studio,imgproxy,logflare,vector,supavisor,realtime
      - run: npm run test:db
      - run: npm run test:auth
      - run: npm run check:edge
      - run: npm run test:edge
      - run: npm run db:types && git diff --exit-code -- src/shared/database.types.ts
