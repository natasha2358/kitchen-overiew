name: Checks
on: [push, pull_request, workflow_dispatch]
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - run: npm ci
      - run: supabase start -x studio,imgproxy,logflare,vector,supavisor,realtime,edge-runtime
      - run: npm run test:db
      - run: npm run test:auth
      - run: npm run check:edge
      - run: npm run test:edge
      - run: npm run test:handlers
      - run: npm run cloud:edge:prepare -- --test-fixtures
      - run: npm run cloud:edge:start -- --test-fixtures
      - run: npm run test:edge:gateway
      - run: npm run test:services
      - run: npm run test:erasure
      - run: npm run test:receipt-processing
        env:
          FUNCTIONS_TEST_URL: http://127.0.0.1:54321/functions/v1
      - run: npm run db:types && git diff --exit-code -- src/shared/database.types.ts
